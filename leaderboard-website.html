<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KLM ESPORTS - LEADERBOARD</title>
  <link href="https://fonts.googleapis.com/css2?family=Teko:wght@600;700&family=Rajdhani:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      /* വെബ്സൈറ്റിന്റെ ഡാർക്ക് ബ്ലാക്ക് & കാർഡ് തീം */
      --page-bg: #0c0907;
      --bg-dark: #14100c;
      --row-bg-1: #1a140e;
      --row-bg-2: #120e0a;
      --gold: #f5a623;
      --gold-light: #ffd27a;
      --border-gold: rgba(245, 166, 35, 0.28);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--page-bg);
      font-family: 'Rajdhani', sans-serif;
      padding: 14px 8px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .hud-wrapper {
      width: 100%;
      max-width: 540px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .hud-container {
      width: 100%;
      min-width: 340px;
      background: var(--bg-dark);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.85), 0 0 18px rgba(245, 166, 35, 0.08);
      border: 1px solid var(--border-gold);
    }

    .hud-header {
      display: grid;
      grid-template-columns: 28px 1fr 34px 36px 36px 44px 58px;
      align-items: center;
      background: linear-gradient(135deg, #f5a623, #d48812);
      color: #120900;
      font-weight: 800;
      font-size: 11px;
      height: 34px;
      padding: 0 6px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
    }

    .hud-header div {
      text-align: center;
      white-space: nowrap;
    }

    .hud-header .col-team-head {
      text-align: left;
      padding-left: 24px;
    }

    .hud-body {
      display: flex;
      flex-direction: column;
    }

    .hud-row {
      display: grid;
      grid-template-columns: 28px 1fr 34px 36px 36px 44px 58px;
      align-items: center;
      height: 38px;
      padding: 0 6px;
      border-bottom: 1px solid rgba(245, 166, 35, 0.08);
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      background: var(--row-bg-1);
      transition: background 0.2s ease, opacity 0.3s ease;
    }

    .hud-row:nth-child(even) {
      background: var(--row-bg-2);
    }

    .hud-row:hover {
      background: rgba(245, 166, 35, 0.12);
    }

    .hud-row.rank-first {
      background: rgba(245, 166, 35, 0.18) !important;
      border-left: 3px solid #f5a623;
    }

    .hud-row.team-wiped {
      opacity: 0.35 !important;
      filter: grayscale(100%) contrast(80%);
      background: rgba(10, 8, 6, 0.75) !important;
      border-left: none !important;
    }

    .col-rank {
      text-align: center;
      font-family: 'Teko', sans-serif;
      font-size: 18px;
      color: #cbd5e1;
      line-height: 1;
    }

    .col-team {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      overflow: hidden;
    }

    .team-logo {
      width: 18px;
      height: 18px;
      min-width: 18px;
      max-width: 18px;
      object-fit: contain;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.06);
      display: block;
    }

    .team-name {
      font-size: 13px;
      font-weight: 800;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      min-width: 0;
    }

    .col-cd {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Teko', sans-serif;
      font-size: 16px;
      color: #ffd700;
      line-height: 1;
    }

    .cd-zero {
      color: #5d5348;
      font-size: 14px;
    }

    .col-place, .col-fin {
      text-align: center;
      font-family: 'Teko', sans-serif;
      font-size: 17px;
      line-height: 1;
    }

    .col-place { color: #e2e8f0; }
    .col-fin { color: #ffffff; }

    .col-pts {
      text-align: center;
      font-family: 'Teko', sans-serif;
      font-size: 18px;
      color: var(--gold-light);
      font-weight: 700;
      line-height: 1;
      text-shadow: 0 0 6px rgba(245, 166, 35, 0.3);
    }

    .col-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2.5px;
      width: 100%;
    }

    .player-slot {
      width: 5px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
    }

    .player-slot.alive .bar-line {
      width: 4px;
      height: 14px;
      background: #ffffff;
      border-radius: 1px;
      box-shadow: 0 0 3px rgba(255, 255, 255, 0.85);
    }

    .player-slot.knocked .bar-line {
      width: 4px;
      height: 14px;
      background: #ff2525;
      border-radius: 1px;
      box-shadow: 0 0 6px #ff0000;
      animation: knockPulse 0.75s infinite alternate ease-in-out;
    }

    .player-slot.recall-available .recall-heart-icon {
      width: 11px;
      height: 11px;
      filter: drop-shadow(0 0 4px #00ff78);
      animation: recallGlow 1.2s infinite alternate ease-in-out;
    }

    .player-slot.dead .bar-line {
      width: 4px;
      height: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 1px;
    }

    @keyframes knockPulse {
      0% { opacity: 1; transform: scaleY(1); }
      100% { opacity: 0.25; transform: scaleY(0.85); }
    }

    @keyframes recallGlow {
      0% { transform: scale(0.9); opacity: 0.6; }
      100% { transform: scale(1.15); opacity: 1; }
    }

    .hud-footer {
      display: flex;
      justify-content: space-between;
      padding: 7px 12px;
      background: #0f0b08;
      font-size: 10px;
      font-weight: 800;
      color: #baa78e;
      letter-spacing: 0.5px;
      border-top: 1px solid rgba(245, 166, 35, 0.15);
      flex-wrap: wrap;
      gap: 5px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      display: inline-block;
    }

    @media (min-width: 480px) {
      body { padding: 20px; }
      .hud-header, .hud-row {
        grid-template-columns: 32px 1fr 40px 42px 42px 50px 72px;
        padding: 0 8px;
      }
      .hud-header { font-size: 13px; height: 34px; }
      .hud-header .col-team-head { padding-left: 28px; }
      .hud-row { height: 38px; font-size: 15px; }
      .team-logo { width: 22px; height: 22px; min-width: 22px; }
      .team-name { font-size: 15px; }
      .col-rank, .col-place, .col-fin { font-size: 21px; }
      .col-pts { font-size: 22px; }
      .col-cd { font-size: 19px; }
      .player-slot { width: 6px; height: 20px; }
      .player-slot.alive .bar-line, .player-slot.knocked .bar-line, .player-slot.dead .bar-line {
        width: 5px;
        height: 18px;
      }
      .player-slot.recall-available .recall-heart-icon { width: 13px; height: 13px; }
      .hud-footer { font-size: 11px; padding: 7px 14px; }
    }
  </style>
</head>
<body>

  <div class="hud-wrapper">
    <div class="hud-container">
      <div class="hud-header">
        <div>#</div>
        <div class="col-team-head">TEAM</div>
        <div>CD</div>
        <div>PLC</div>
        <div>FIN</div>
        <div>TOTAL</div>
        <div>STATUS</div>
      </div>

      <div class="hud-body" id="hud-rows">
        <div style="padding: 16px; text-align: center; font-size: 14px; color: var(--gold);">
          Loading Standings...
        </div>
      </div>

      <div class="hud-footer">
        <div class="legend-item"><span class="dot" style="background:#fff;"></span> ALIVE</div>
        <div class="legend-item"><span class="dot" style="background:#ff2525;"></span> KNOCK</div>
        <div class="legend-item">
          <svg style="width:11px;height:11px;fill:#00ff78;" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          RECALL
        </div>
        <div class="legend-item"><span class="dot" style="border:1px solid #baa78e;"></span> ELIM</div>
      </div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyftk6SwirNFe6D11wifUQEf2rQLybnngEggi0_y5lXOMLWtqLNX-Oho590aFfxSlKUEQ/exec";
    const DEFAULT_LOGO = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24' fill='%23f5a623'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>";

    const BGMI_RECALL_HEART_SVG = `
      <svg class="recall-heart-icon" viewBox="0 0 24 24">
        <path fill="#00ff78" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
        <path fill="#0e0b07" d="M12 6.8c-2.4 0-4.3 1.9-4.3 4.3h1.4c0-1.6 1.3-2.9 2.9-2.9 1.6 0 2.9 1.3 2.9 2.9s-1.3 2.9-2.9 2.9v1.4c2.4 0 4.3-1.9 4.3-4.3s-1.9-4.3-4.3-4.3z"/>
        <polygon fill="#0e0b07" points="11,14 13.5,14 12,16.5"/>
      </svg>
    `;

    function escapeText(str) {
      if (!str) return "";
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function createStatusBars(alive = 4, knocked = 0, recallAvailable = false) {
      alive = Math.max(0, parseInt(alive) || 0);
      knocked = Math.max(0, parseInt(knocked) || 0);

      let slotsHtml = '';
      for (let i = 0; i < 4; i++) {
        if (knocked > 0) {
          slotsHtml += '<div class="player-slot knocked"><div class="bar-line"></div></div>';
          knocked--;
        } else if (alive > 0) {
          slotsHtml += '<div class="player-slot alive"><div class="bar-line"></div></div>';
          alive--;
        } else {
          if (recallAvailable) {
            slotsHtml += `<div class="player-slot recall-available" title="Recall Available">${BGMI_RECALL_HEART_SVG}</div>`;
          } else {
            slotsHtml += '<div class="player-slot dead"><div class="bar-line"></div></div>';
          }
        }
      }
      return slotsHtml;
    }

    async function updateHUD() {
      try {
        const res = await fetch(`${SCRIPT_URL}?nocache=${Date.now()}`);
        const teams = await res.json();
        const container = document.getElementById('hud-rows');

        if (!Array.isArray(teams)) return;

        let fragment = '';
        teams.forEach((t, i) => {
          const rank = i + 1;
          const isFirst = rank === 1 ? 'rank-first' : '';
          const safeTeamName = escapeText(t.team || `Team ${rank}`);
          const safeLogo = t.logo ? t.logo.replace(/"/g, '&quot;') : DEFAULT_LOGO;
          
          const cdVal = Number(t.cd) || 0;
          const placePts = Number(t.placePts) || 0;
          const finishes = Number(t.finishes) || 0;
          const totalPts = Number(t.totalPts) || 0;

          const aliveCount = t.alive !== undefined ? Number(t.alive) : 4;
          const knockCount = t.knocked !== undefined ? Number(t.knocked) : 0;
          const recallAvailable = Boolean(t.recallAvailable);
          const isWiped = (aliveCount <= 0 && knockCount <= 0) ? 'team-wiped' : '';

          let cdDisplay = cdVal > 0 ? `${cdVal}🍗` : `<span class="cd-zero">-</span>`;
          const statusHtml = createStatusBars(aliveCount, knockCount, recallAvailable);

          fragment += `
            <div class="hud-row ${isFirst} ${isWiped}">
              <div class="col-rank">${rank}</div>
              <div class="col-team">
                <img class="team-logo" src="${safeLogo}" alt="" onerror="this.onerror=null;this.src='${DEFAULT_LOGO}';">
                <span class="team-name" title="${safeTeamName}">${safeTeamName}</span>
              </div>
              <div class="col-cd">${cdDisplay}</div>
              <div class="col-place">${placePts}</div>
              <div class="col-fin">${finishes}</div>
              <div class="col-pts">${totalPts}</div>
              <div class="col-status">${statusHtml}</div>
            </div>
          `;
        });

        if (fragment) {
          container.innerHTML = fragment;
        }
      } catch (err) {
        console.error("HUD Sync Error:", err);
      }
    }

    // പേജ് ലോഡ് ആകുമ്പോൾ മാത്രം വിവരങ്ങൾ ലോഡ് ചെയ്യുന്നു
    updateHUD();
  </script>
</body>
</html>
