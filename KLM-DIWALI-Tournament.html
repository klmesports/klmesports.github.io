<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KLM DIWALI SPECIALS – KLM Esports Tournament</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0906;--panel:#17120c;--panel2:#221b12;--line:#2c2217;
  --gold:#e0a030;--gold2:#ffd27a;--text:#ffffff;--muted:#a39580;--sand:#dfd5c6;--green:#6cc04a;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;color:var(--text);font-family:'Rajdhani','Segoe UI',sans-serif;font-size:18px;line-height:1.3;
  background:radial-gradient(ellipse at 50% 0%,#3a2410 0%,transparent 60%),radial-gradient(ellipse at 50% 100%,#29180b 0%,transparent 55%),var(--bg)}
#sparks{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.screen{position:relative;height:100%;max-width:560px;margin:0 auto;padding:12px 18px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center}
.logo{display:block;margin:0 auto;height:min(24vh,170px);width:auto;aspect-ratio:1;-webkit-mask-image:radial-gradient(circle,#000 58%,transparent 72%);mask-image:radial-gradient(circle,#000 58%,transparent 72%)}
.brand{font-family:'Teko',sans-serif;font-size:20px;letter-spacing:.2em;color:var(--gold);margin:0}
.badge{display:inline-block;padding:2px 14px;border:1px solid var(--green);color:var(--green);border-radius:999px;font-weight:700;font-size:14px;letter-spacing:.1em}
h1{font-family:'Teko',sans-serif;font-weight:700;font-size:clamp(44px,13vw,84px);line-height:.9;margin:4px 0;color:var(--gold);text-shadow:0 0 34px rgba(224,160,48,.35)}
h1 span{display:block;color:var(--gold2)}
.date{font-size:20px;color:var(--sand);font-weight:600;margin:0}
.timer{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.timer div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 0}
.timer b{display:block;font-family:'Teko',sans-serif;font-size:clamp(34px,10vw,52px);line-height:1;color:var(--gold2);font-weight:600;font-variant-numeric:tabular-nums}
.timer small{color:var(--muted);font-size:13px;letter-spacing:.1em;text-transform:uppercase}
.timer-label{color:var(--muted);font-size:14px;letter-spacing:.14em;margin:0 0 4px;text-transform:uppercase}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.fact{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 4px}
.fact b{display:block;font-family:'Teko',sans-serif;font-size:28px;line-height:1.1;font-weight:600}
.fact small{color:var(--muted);font-size:14px}
.prizes{display:grid;grid-template-columns:1.4fr 1fr;gap:8px;width:100%}
.prize{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px}
.prize.first{border-color:var(--gold);background:linear-gradient(180deg,#2d2113,var(--panel2));box-shadow:0 0 28px rgba(224,160,48,.15)}
.prize .pos{color:var(--sand);font-weight:600;font-size:15px}
.prize .amt{font-family:'Teko',sans-serif;font-size:44px;line-height:1;color:var(--gold2);font-weight:700}
.prize:not(.first) .amt{font-size:34px;color:var(--sand)}
.cta{display:block;width:100%;padding:10px;background:linear-gradient(180deg,var(--gold2),var(--gold));color:#1a1107;font-family:'Teko',sans-serif;font-size:28px;font-weight:700;letter-spacing:.08em;text-decoration:none;border-radius:6px;box-shadow:0 6px 28px rgba(224,160,48,.3)}
.cta:hover{background:var(--gold2)}
.cta:focus-visible{outline:3px solid var(--gold2);outline-offset:3px}
@media(max-height:620px){.timer-label{display:none}.logo{height:90px}h1{font-size:44px}.prize .amt{font-size:32px}}
@media(prefers-reduced-motion:reduce){#sparks{display:none}}
</style>
</head>

</main>

<script>
(function(){
  var now=new Date(),y=now.getFullYear();
  var target=new Date(y,10,8,0,0,0);
  if(now>new Date(y,10,9))target=new Date(y+1,10,8,0,0,0);
  function p(n){return n<10?'0'+n:''+n}
  function tick(){
    var t=Math.max(0,target-new Date()),s=Math.floor(t/1000);
    document.getElementById('d').textContent=p(Math.floor(s/86400));
    document.getElementById('h').textContent=p(Math.floor(s%86400/3600));
    document.getElementById('m').textContent=p(Math.floor(s%3600/60));
    document.getElementById('s').textContent=p(s%60);
  }
  tick();setInterval(tick,1000);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var c=document.getElementById('sparks'),x=c.getContext('2d'),P=[],W,H;
  function size(){W=c.width=c.offsetWidth;H=c.height=c.offsetHeight}
  size();addEventListener('resize',size);
  for(var i=0;i<40;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,v:Math.random()*.5+.2,a:Math.random()});
  (function loop(){
    x.clearRect(0,0,W,H);
    P.forEach(function(q){
      q.y-=q.v;q.a+=.02;if(q.y<-5){q.y=H+5;q.x=Math.random()*W}
      x.globalAlpha=.25+.5*Math.abs(Math.sin(q.a));
      x.fillStyle='#ffd27a';x.beginPath();x.arc(q.x,q.y,q.r,0,6.283);x.fill();
    });
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
