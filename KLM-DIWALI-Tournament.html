<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KLM DIWALI SPECIALS – KLM Esports Tournament</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0c0906;--panel:#17120c;--panel2:#221b12;--line:#2c2217;
  --gold:#e0a030;--gold2:#ffd27a;--text:#ffffff;--muted:#a39580;--sand:#dfd5c6;--green:#6cc04a;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:border-box}

html{
  min-height:100%;
  background: var(--bg);
}

body{
  margin:0;
  min-height:100vh;
  overflow-x:hidden;
  overflow-y:auto;
  color:var(--text);
  font-family:'Rajdhani','Segoe UI',sans-serif;
  font-size:18px;
  line-height:1.3;
  background:radial-gradient(ellipse at 50% 0%,#3a2410 0%,transparent 60%),radial-gradient(ellipse at 50% 100%,#29180b 0%,transparent 55%),var(--bg);
  padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px) 16px;
  display: flex;
  justify-content: center;
  align-items: center;
}

#sparks{
  position:fixed;
  inset:0;
  width:100vw;
  height:100vh;
  pointer-events:none;
  z-index: 0;
}

.screen{
  position:relative;
  z-index: 1;
  width: 100%;
  max-width:480px;
  margin:auto;
  padding: 16px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  gap: 14px;
}

.logo-header {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
}

.logo{
  display:block;
  margin:0 auto 10px auto;
  height: 110px;
  width:auto;
  aspect-ratio:1;
  object-fit: contain;
  border-radius: 12px;
}

.badge{
  display:inline-block;
  padding:2px 14px;
  border:1px solid var(--green);
  color:var(--green);
  border-radius:999px;
  font-weight:700;
  font-size:13px;
  letter-spacing:.1em;
}

h1{
  font-family:'Teko',sans-serif;
  font-weight:700;
  font-size: clamp(38px, 8vw, 56px);
  line-height:.95;
  margin: 6px 0 2px 0;
  color:var(--gold);
  text-shadow:0 0 24px rgba(224,160,48,.35);
}
h1 span{display:block;color:var(--gold2)}

.date{
  font-size:18px;
  color:var(--sand);
  font-weight:600;
  margin:0;
}

.timer-box {
  width: 100%;
}

.timer-label{
  color:var(--muted);
  font-size:13px;
  letter-spacing:.14em;
  margin:0 0 6px;
  text-transform:uppercase;
}

.timer{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  width:100%;
}

.timer div{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
  padding:6px 0;
}

.timer b{
  display:block;
  font-family:'Teko',sans-serif;
  font-size: 34px;
  line-height:1;
  color:var(--gold2);
  font-weight:600;
  font-variant-numeric:tabular-nums;
}

.timer small{
  color:var(--muted);
  font-size:12px;
  letter-spacing:.1em;
  text-transform:uppercase;
}

.facts{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  width:100%;
}

.fact{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:8px;
  padding:6px 4px;
}

.fact b{
  display:block;
  font-family:'Teko',sans-serif;
  font-size:24px;
  line-height:1.1;
  font-weight:600;
}

.fact small{
  color:var(--muted);
  font-size:13px;
}

.prizes{
  display:grid;
  grid-template-columns:1.3fr 1fr;
  gap:8px;
  width:100%;
}

.prize{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:8px;
  padding:6px;
}

.prize.first{
  border-color:var(--gold);
  background:linear-gradient(180deg,#2d2113,var(--panel2));
  box-shadow:0 0 20px rgba(224,160,48,.15);
}

.prize .pos{color:var(--sand);font-weight:600;font-size:14px}
.prize .amt{font-family:'Teko',sans-serif;font-size:38px;line-height:1;color:var(--gold2);font-weight:700}
.prize:not(.first) .amt{font-size:30px;color:var(--sand)}

.cta{
  display:block;
  width:100%;
  padding:8px;
  background:linear-gradient(180deg,var(--gold2),var(--gold));
  color:#1a1107;
  font-family:'Teko',sans-serif;
  font-size:26px;
  font-weight:700;
  letter-spacing:.08em;
  text-decoration:none;
  border-radius:6px;
  box-shadow:0 4px 20px rgba(224,160,48,.3);
  margin-top: 4px;
}
.cta:hover{background:var(--gold2)}

@media (max-height: 520px) {
  .logo{height: 60px}
  h1{font-size: 32px}
  .screen{gap: 8px; padding: 10px;}
  .timer b{font-size: 26px}
  .fact b{font-size: 20px}
  .prize .amt{font-size: 26px}
  .cta{font-size: 22px; padding: 5px}
}

@media(prefers-reduced-motion:reduce){#sparks{display:none}}
</style>
</head>
<body>
<canvas id="sparks" aria-hidden="true"></canvas>
<main class="screen">
  <div class="logo-header">
    <!-- ലോഗോ ഫയൽ നെയിം കൃത്യമായി ഇവിടെ നൽകുക -->
    <img class="logo" alt="KLM Esports – Kerala Masters Esports" src="logo.png">
    <span class="badge">SQUAD TOURNAMENT</span>
    <h1>KLM <span>DIWALI SPECIALS</span></h1>
    <p class="date">8 November</p>
  </div>

  <div class="timer-box">
    <p class="timer-label">Tournament starts in</p>
    <div class="timer" role="timer" aria-live="off">
      <div><b id="d">00</b><small>Days</small></div>
      <div><b id="h">00</b><small>Hours</small></div>
      <div><b id="m">00</b><small>Min</small></div>
      <div><b id="s">00</b><small>Sec</small></div>
    </div>
  </div>

  <div class="facts">
    <div class="fact"><b>8 Nov</b><small>Match day</small></div>
    <div class="fact"><b>Squad</b><small>Format</small></div>
    <div class="fact"><b>₹10</b><small>Entry fee</small></div>
  </div>

  <div class="prizes">
    <div class="prize first"><div class="pos">1st prize</div><div class="amt">₹150</div></div>
    <div class="prize"><div class="pos">2nd prize</div><div class="amt">₹50</div></div>
  </div>

  <a class="cta" href="registration-page-2.html">REGISTER NOW</a>
</main>

<script>
(function(){
  var now=new Date(),y=now.getFullYear();
  var target=new Date(y,10,8,0,0,0);
  if(now>new Date(y,10,9))target=new Date(y+1,10,8,0,0,0);
  function p(n){return n<10?'0'+n:''+n}
  function tick(){
    var t=Math.max(0,target-new Date()),s=Math.floor(t/1000);
    document.getElementById('d').textContent=p(Math.floor(s/86400));
    document.getElementById('h').textContent=p(Math.floor(s%86400/3600));
    document.getElementById('m').textContent=p(Math.floor(s%3600/60));
    document.getElementById('s').textContent=p(s%60);
  }
  tick();setInterval(tick,1000);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  var c=document.getElementById('sparks'),x=c.getContext('2d'),P=[],W,H;
  function size(){W=c.width=window.innerWidth;H=c.height=window.innerHeight}
  size();addEventListener('resize',size);
  for(var i=0;i<40;i++)P.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.4,v:Math.random()*.5+.2,a:Math.random()});
  (function loop(){
    x.clearRect(0,0,W,H);
    P.forEach(function(q){
      q.y-=q.v;q.a+=.02;if(q.y<-5){q.y=H+5;q.x=Math.random()*W}
      x.globalAlpha=.25+.5*Math.abs(Math.sin(q.a));
      x.fillStyle='#ffd27a';x.beginPath();x.arc(q.x,q.y,q.r,0,6.283);x.fill();
    });
    requestAnimationFrame(loop);
  })();
})();
</script>
</body>
</html>
